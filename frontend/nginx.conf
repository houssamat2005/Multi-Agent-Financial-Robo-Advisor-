server {
    listen 80;
    server_name localhost;

    # Répertoire racine où se trouvent les fichiers construits
    root /usr/share/nginx/html;
    index index.html;

    # Gérer le routage React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend pour l'API
    location /api/ {
        # proxy_pass redirige la requête vers le conteneur 'backend' sur le port 8000
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy vers le backend pour les WebSockets
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
