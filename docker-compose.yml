version: "3.9"

networks:
  robo-net:
    driver: bridge

volumes:
  pgdata:
  neo4jdata:
  chromadata:
  redisdata:
  mlflowdata:
  zookeeperdata:
  kafkadata:

services:
  # ── Backend API ─────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: robo_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - robo-net

  # ── Celery Worker ───────────────────────────────────────────
  celery_worker:
    build: ./backend
    container_name: robo_celery
    restart: unless-stopped
    command: celery -A tasks.celery_app worker -l info
    depends_on:
      - redis
      - postgres
    env_file:
      - ./backend/.env
    networks:
      - robo-net
    healthcheck:
      disable: true

  # ── Celery Beat (Scheduler) ─────────────────────────────────
  celery_beat:
    build: ./backend
    container_name: robo_celery_beat
    restart: unless-stopped
    command: celery -A tasks.celery_app beat -l info
    depends_on:
      - redis
      - postgres
    env_file:
      - ./backend/.env
    networks:
      - robo-net
    healthcheck:
      disable: true

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: robo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - robo-net
    depends_on:
      - backend

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: robo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: roboadvisor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - robo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roboadvisor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: robo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - robo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ───────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: robo_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    volumes:
      - neo4jdata:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - robo-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── ChromaDB ────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: robo_chroma
    restart: unless-stopped
    volumes:
      - chromadata:/chroma/chroma
    ports:
      - "8001:8000"
    networks:
      - robo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || curl -f http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Zookeeper ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: robo_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeperdata:/var/lib/zookeeper/data
    ports:
      - "2181:2181"
    networks:
      - robo-net

  # ── Kafka ───────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: robo_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "9092:9092"
    networks:
      - robo-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Kafka Init ──────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: robo_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Création des topics Kafka...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic prices-raw --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic news-raw --partitions 3 --replication-factor 1
      echo 'Topics créés :'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - robo-net

  # ── MLflow ──────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: robo_mlflow
    restart: unless-stopped
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflowdata:/mlflow
    ports:
      - "5000:5000"
    networks:
      - robo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
